<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الدردشة الجماعية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* ------------------- صفحة تسجيل الدخول بالتاريخ ------------------- */
    .login-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    .login-card p {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .login-card input[type="date"],
    .login-card input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .login-card input:focus {
      border-color: #2a5298;
    }

    .login-btn {
      width: 100%;
      background: #2a5298;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background: #1e3c72;
    }

    .error-msg {
      color: #dc3545;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* ------------------- واجهة الشات الرئيسية ------------------- */
    .chat-container {
      display: none; /* مخفية حتى يتم تأكيد التاريخ */
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }

    /* الشريط العلوي للشات */
    .chat-header {
      background-color: #2a5298;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2 {
      font-size: 1.2rem;
    }

    .clear-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background-color: #bd2130;
    }

    /* منطقة عرض الرسائل */
    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #f4f6f9;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      align-self: flex-start;
      word-wrap: break-word;
    }

    .message.my-message {
      background-color: #2a5298;
      color: white;
      align-self: flex-end;
    }

    .message .sender-name {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 3px;
      color: #777;
    }

    .message.my-message .sender-name {
      color: #d0e1ff;
    }

    .message .text {
      font-size: 0.95rem;
    }

    /* نموذج إدخال البيانات */
    .chat-footer {
      padding: 15px;
      background-color: #fff;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .username-display {
      font-size: 0.85rem;
      color: #555;
      font-weight: bold;
      padding-bottom: 2px;
    }

    .message-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .message-input:focus {
      border-color: #2a5298;
    }

    .send-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <!-- 1. شاشة الدخول بالتاريخ المميز -->
  <div class="login-card" id="login-card">
    <h2>🔒 مرحباً بك</h2>
    <p>يرجى إدخال اسمك والتاريخ المميز للدخول إلى الشات</p>
    
    <input type="text" id="user-name-input" placeholder="اكتب اسمك هنا..." />
    <input type="date" id="special-date-input" />
    
    <button class="login-btn" onclick="validateAndEnter()">دخول للشات</button>
    <div class="error-msg" id="error-msg">⚠️ التاريخ المميز غير صحيح!</div>
  </div>

  <!-- 2. واجهة الدردشة الرئيسية -->
  <div class="chat-container" id="chat-container">
    <div class="chat-header">
      <h2>💬 غرفة الدردشة</h2>
      <button class="clear-btn" onclick="clearChat()">🗑️ مسح الشات</button>
    </div>

    <div class="messages-container" id="messages-container"></div>

    <div class="chat-footer">
      <div class="username-display" id="user-display">المستخدم: </div>
      <div class="input-row">
        <input type="text" id="message-input" class="message-input" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)" />
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <!-- مكتبة Socket.io -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // -------------------------------------------------------------
    // غيّر هذا التاريخ للتاريخ المميز الذي تريده (صيغة: YYYY-MM-DD)
    // -------------------------------------------------------------
    const SPECIAL_DATE = "2024-01-01"; 

    let currentUser = "";
    const socket = io();

    const loginCard = document.getElementById('login-card');
    const chatContainer = document.getElementById('chat-container');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const errorMsg = document.getElementById('error-msg');
    const userDisplay = document.getElementById('user-display');

    // التحقق من التاريخ المميز والدخول
    function validateAndEnter() {
      const nameInput = document.getElementById('user-name-input').value.trim();
      const selectedDate = document.getElementById('special-date-input').value;

      if (!nameInput) {
        alert("يرجى كتابة اسمك أولاً!");
        return;
      }

      if (selectedDate === SPECIAL_DATE) {
        currentUser = nameInput;
        userDisplay.textContent = "المستخدم الحالي: " + currentUser;
        
        loginCard.style.display = "none";
        chatContainer.style.display = "flex";
        
        // التمرير لأسفل المحادثة فور الدخول
        scrollToBottom();
      } else {
        errorMsg.style.display = "block";
      }
    }

    // 1. استقبال الرسائل القديمة المخزنة عند فتح الموقع
    socket.on('load_messages', (messages) => {
      messagesContainer.innerHTML = '';
      messages.forEach(msg => {
        appendMessage(msg.sender, msg.text);
      });
      scrollToBottom();
    });

    // 2. استقبال رسالة جديدة من أحد المتصلين
    socket.on('receive_message', (data) => {
      appendMessage(data.sender, data.text);
      scrollToBottom();
    });

    // 3. إرسال رسالة جديدة
    function sendMessage() {
      const text = messageInput.value.trim();

      if (text !== '') {
        socket.emit('send_message', { sender: currentUser, text: text });
        messageInput.value = '';
        messageInput.focus();
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // 4. عرض الرسالة داخل الشاشة
    function appendMessage(sender, text) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message');
      
      if (sender === currentUser) {
        messageDiv.classList.add('my-message');
      }

      const senderDiv = document.createElement('div');
      senderDiv.classList.add('sender-name');
      senderDiv.textContent = sender;

      const textDiv = document.createElement('div');
      textDiv.classList.add('text');
      textDiv.textContent = text;

      messageDiv.appendChild(senderDiv);
      messageDiv.appendChild(textDiv);

      messagesContainer.appendChild(messageDiv);
    }

    // 5. دالة مسح الشات بكلمة السر
    function clearChat() {
      const password = prompt("أدخل كلمة السر لمسح جميع الرسائل:");
      if (password) {
        socket.emit('clear_chat', { password });
      }
    }

    // 6. عند تأكيد مسح الشات من السيرفر
    socket.on('chat_cleared', () => {
      messagesContainer.innerHTML = '';
      alert('✅ تم مسح جميع الرسائل بنجاح.');
    });

    // 7. عند كتابة كلمة سر مسح خاطئة
    socket.on('error_message', (msg) => {
      alert(msg);
    });

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
  </script>

</body>
</html>
