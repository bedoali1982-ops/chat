<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الشات الجماعي</title>
    <!-- استدعاء مكتبة Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- شاشة التسجيل --- */
        #login-screen {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        #login-screen h2 {
            margin-bottom: 20px;
            color: #128C7E;
        }

        #login-screen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        #login-screen button {
            width: 100%;
            padding: 12px;
            background-color: #128C7E;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        #login-screen button:hover {
            background-color: #075E54;
        }

        /* --- شاشة الشات --- */
        #chat-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* الهيدر */
        .chat-header {
            background-color: #075E54;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-buttons button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 13px;
        }

        .header-buttons button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .header-buttons .clear-btn {
            background-color: #d32f2f;
        }

        .header-buttons .clear-btn:hover {
            background-color: #9a0007;
        }

        /* منطقة الرسائل */
        #messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            position: relative;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
        }

        .my-message {
            align-self: flex-end;
            background-color: #dcf8c6;
            border-bottom-left-radius: 10px;
        }

        .other-message {
            align-self: flex-start;
            background-color: white;
            border-bottom-right-radius: 10px;
        }

        .sender-name {
            font-size: 12px;
            font-weight: bold;
            color: #075E54;
            margin-bottom: 3px;
        }

        .message-text {
            font-size: 15px;
            color: #333;
            margin-bottom: 5px;
        }

        .message-file {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .message-file img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .message-file a {
            color: #128C7E;
            text-decoration: underline;
            font-weight: bold;
        }

        /* 🕒 تنسيق تاريخ ووقت الرسالة */
        .message-time {
            font-size: 10px;
            color: #777;
            align-self: flex-end;
            margin-top: 2px;
            direction: ltr; /* لضمان أرقام الوقت والتاريخ بشكل مريح */
        }

        /* منطقة إدخال الرسائل */
        .chat-input-container {
            padding: 12px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input-container input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .file-label {
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
        }

        #file-input {
            display: none;
        }

        .send-btn {
            background-color: #128C7E;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .send-btn:hover {
            background-color: #075E54;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة التسجيل -->
    <div id="login-screen">
        <h2>مرحباً بك في الشات</h2>
        <input type="text" id="username-input" placeholder="أدخل اسمك هنا..." />
        <button onclick="login()">دخول</button>
    </div>

    <!-- 2. شاشة الشات -->
    <div id="chat-screen">
        <div class="chat-header">
            <h3 id="user-display">الشات الجماعي</h3>
            <div class="header-buttons">
                <button class="clear-btn" onclick="clearChat()">🗑️ مسح الشات</button>
                <button onclick="logout()">خروج</button>
            </div>
        </div>

        <div id="messages-container"></div>

        <div class="chat-input-container">
            <label for="file-input" class="file-label" title="إرفاق ملف أو صورة">📎</label>
            <input type="file" id="file-input" onchange="handleFileSelect(event)">
            
            <input type="text" id="message-input" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = '';
        let selectedFileData = null;

        // عند فتح الصفحة: التحقق من وجود جلسة محفوظة
        window.onload = () => {
            const savedUser = sessionStorage.getItem('chat_username');
            if (savedUser) {
                currentUser = savedUser;
                showChatScreen();
            }
        };

        // تسجيل الدخول
        function login() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) {
                alert('يرجى إدخال اسمك أولاً!');
                return;
            }
            currentUser = username;
            sessionStorage.setItem('chat_username', currentUser);
            showChatScreen();
        }

        function showChatScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('user-display').innerText = `المستخدم: ${currentUser}`;
        }

        // تسجيل الخروج
        function logout() {
            sessionStorage.removeItem('chat_username');
            location.reload();
        }

        // استقبال الملفات المختارة
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFileData = {
                    file: e.target.result,
                    fileName: file.name,
                    fileType: file.type
                };
                alert(`تم تحديد الملف: ${file.name}`);
            };
            reader.readAsDataURL(file);
        }

        // إرسال الرسالة
        function sendMessage() {
            const textInput = document.getElementById('message-input');
            const text = textInput.value.trim();

            if (!text && !selectedFileData) return;

            const msgPayload = {
                sender: currentUser,
                text: text,
                file: selectedFileData ? selectedFileData.file : null,
                fileName: selectedFileData ? selectedFileData.fileName : null,
                fileType: selectedFileData ? selectedFileData.fileType : null
            };

            socket.emit('send_message', msgPayload);

            // تفريغ المدخلات
            textInput.value = '';
            document.getElementById('file-input').value = '';
            selectedFileData = null;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // استقبال الرسائل القديمة فور الدخول
        socket.on('load_old_messages', (messages) => {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
            scrollToBottom();
        });

        // استقبال رسالة جديدة من السيرفر
        socket.on('receive_message', (msg) => {
            appendMessage(msg);
            scrollToBottom();
        });

        // دوال مسح الشات
        function clearChat() {
            const password = prompt('أدخل كلمة السر لمسح الشات كاملاً:');
            if (password) {
                socket.emit('clear_chat', { password });
            }
        }

        socket.on('chat_cleared', () => {
            document.getElementById('messages-container').innerHTML = '';
            alert('تم مسح جميع الرسائل بنجاح.');
        });

        socket.on('error_message', (msg) => {
            alert(msg);
        });

        // 🕒 عرض وتنسيق الرسائل مع التاريخ والوقت
        function appendMessage(data) {
            const container = document.getElementById('messages-container');
            const isMine = data.sender === currentUser;

            // تنسيق التاريخ والوقت كاملاً بحسب جهاز المستخدم
            let formattedDateTime = '';
            if (data.createdAt) {
                const msgDate = new Date(data.createdAt);
                formattedDateTime = msgDate.toLocaleString(navigator.language || 'ar-EG', { 
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit', 
                    minute: '2-digit', 
                    hour12: true 
                });
            }

            // بناء عنصر الرسالة
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMine ? 'my-message' : 'other-message'}`;

            let htmlContent = `<span class="sender-name">${data.sender}</span>`;

            if (data.text) {
                htmlContent += `<p class="message-text">${data.text}</p>`;
            }

            if (data.file) {
                htmlContent += `<div class="message-file">`;
                if (data.fileType && data.fileType.startsWith('image/')) {
                    htmlContent += `<img src="${data.file}" alt="صورة مرفقة" />`;
                } else {
                    htmlContent += `<a href="${data.file}" download="${data.fileName}">📁 ${data.fileName}</a>`;
                }
                htmlContent += `</div>`;
            }

            htmlContent += `<span class="message-time">${formattedDateTime}</span>`;

            msgDiv.innerHTML = htmlContent;
            container.appendChild(msgDiv);
        }

        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
