<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الدردشة الجماعية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }

    /* الهيدر / الشريط العلوي */
    .chat-header {
      background-color: #007bff;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2 {
      font-size: 1.2rem;
    }

    .clear-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background-color: #bd2130;
    }

    /* منطقة عرض الرسائل */
    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #f9f9f9;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      background-color: #e9ecef;
      align-self: flex-start;
      word-wrap: break-word;
    }

    .message.my-message {
      background-color: #007bff;
      color: white;
      align-self: flex-end;
    }

    .message .sender-name {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 3px;
      color: #555;
    }

    .message.my-message .sender-name {
      color: #e0e0e0;
    }

    .message .text {
      font-size: 0.95rem;
    }

    /* نموذج إدخال البيانات */
    .chat-footer {
      padding: 15px;
      background-color: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    .username-input {
      width: 100%;
    }

    .message-input {
      flex: 1;
    }

    .send-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- الشريط العلوي -->
    <div class="chat-header">
      <h2>💬 غرفة الدردشة</h2>
      <button class="clear-btn" onclick="clearChat()">🗑️ مسح الشات</button>
    </div>

    <!-- صندوق عرض الرسائل -->
    <div class="messages-container" id="messages-container"></div>

    <!-- منطقة الكتابة والإرسال -->
    <div class="chat-footer">
      <input type="text" id="username" class="username-input" placeholder="اكتب اسمك هنا..." />
      <div class="input-row">
        <input type="text" id="message-input" class="message-input" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)" />
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <!-- مكتبة Socket.io -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // الاتصال بالسيرفر
    const socket = io();

    const messagesContainer = document.getElementById('messages-container');
    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('message-input');

    // 1. استقبال الرسائل القديمة المخزنة عند الدخول للموقع
    socket.on('load_messages', (messages) => {
      messagesContainer.innerHTML = ''; // تفريغ القائمة أولاً
      messages.forEach(msg => {
        appendMessage(msg.sender, msg.text);
      });
      scrollToBottom();
    });

    // 2. استقبال رسالة جديدة من أحد المتصلين
    socket.on('receive_message', (data) => {
      appendMessage(data.sender, data.text);
      scrollToBottom();
    });

    // 3. إرسال رسالة جديدة
    function sendMessage() {
      const sender = usernameInput.value.trim() || 'زائر';
      const text = messageInput.value.trim();

      if (text !== '') {
        socket.emit('send_message', { sender, text });
        messageInput.value = '';
        messageInput.focus();
      }
    }

    // الإرسال عند الضغط على Enter
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // 4. إضافة الرسالة إلى الشاشة
    function appendMessage(sender, text) {
      const myName = usernameInput.value.trim() || 'زائر';

      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message');
      
      if (sender === myName) {
        messageDiv.classList.add('my-message');
      }

      const senderDiv = document.createElement('div');
      senderDiv.classList.add('sender-name');
      senderDiv.textContent = sender;

      const textDiv = document.createElement('div');
      textDiv.classList.add('text');
      textDiv.textContent = text;

      messageDiv.appendChild(senderDiv);
      messageDiv.appendChild(textDiv);

      messagesContainer.appendChild(messageDiv);
    }

    // 5. دالة طلب مسح الشات بكلمة السر
    function clearChat() {
      const password = prompt("أدخل كلمة السر لمسح جميع الرسائل:");
      if (password) {
        socket.emit('clear_chat', { password });
      }
    }

    // 6. عند نجاح المسح في السيرفر
    socket.on('chat_cleared', () => {
      messagesContainer.innerHTML = '';
      alert('✅ تم مسح جميع الرسائل بنجاح.');
    });

    // 7. عند كتابة كلمة سر خاطئة
    socket.on('error_message', (msg) => {
      alert(msg);
    });

    // التمرير التلقائي لأسفل صندوق المحادثة
    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
  </script>

</body>
</html>
