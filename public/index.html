<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letschat - غرفة الدردشة الخاصة</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .hidden { display: none !important; }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0f172a;
            color: var(--text);
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background: var(--primary);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover { background: var(--primary-hover); }

        /* الشات والقائمة الجانبية */
        .chat-container { display: flex; gap: 15px; }
        .chat-main { flex: 3; }
        .users-sidebar {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            height: 340px;
            overflow-y: auto;
        }

        .users-sidebar h4 {
            margin: 0 0 10px 0;
            color: var(--success);
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .user-item {
            padding: 6px 0;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        #chat-box {
            height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            background: #0b0f19;
        }

        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg span { font-weight: bold; color: #818cf8; }

        /* شريط الأدوات ولوحة الإيموجي */
        .input-bar { display: flex; gap: 8px; align-items: center; position: relative; }
        .emoji-btn { width: 50px; background: #334155; font-size: 18px; }
        .emoji-picker {
            position: absolute;
            bottom: 55px;
            right: 0;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            width: 280px;
            height: 180px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .emoji-picker span {
            font-size: 20px;
            cursor: pointer;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
        }

        .emoji-picker span:hover { background: #334155; }

        /* أزرار المكالمات */
        .call-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-call { background: #059669; }
        .btn-call:hover { background: #047857; }
        .btn-hangup { background: var(--danger); }
        .btn-hangup:hover { background: #dc2626; }

        .video-grid {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        video {
            width: 50%;
            height: 180px;
            border-radius: 8px;
            background: #000;
            border: 1px solid var(--border);
            object-fit: cover;
        }
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="login-screen" class="box" style="max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Letschat 💬</h2>
    <input type="text" id="username" placeholder="اسم المستخدم...">
    <label for="special-date" style="font-size: 13px; color: var(--text-muted);">اختر التاريخ المميز:</label>
    <input type="date" id="special-date" min="1926-01-01" max="2026-12-31">
    <button onclick="login()">دخول الغرفة</button>
    <p id="error-msg" style="color: var(--danger); text-align: center; font-size: 13px;"></p>
</div>

<!-- شاشة الشات الرئيسية -->
<div id="chat-screen" class="box hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin:0;">غرفة الدردشة الخاصة</h3>
    </div>
    
    <div class="chat-container">
        <!-- منطقة الشات -->
        <div class="chat-main">
            <div id="chat-box"></div>
            
            <div class="input-bar">
                <input type="text" id="message-input" placeholder="اكتب رسالتك...">
                <button class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
                
                <!-- باقة الإيموجي الموسعة -->
                <div id="emoji-picker" class="emoji-picker hidden">
                    <!-- الوجوه والتعبيرات -->
                    <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('🤣')">🤣</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('😎')">😎</span>
                    <span onclick="addEmoji('😇')">😇</span><span onclick="addEmoji('🥳')">🥳</span><span onclick="addEmoji('🤔')">🤔</span><span onclick="addEmoji('😅')">😅</span><span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('😜')">😜</span>
                    <span onclick="addEmoji('🙈')">🙈</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('💯')">💯</span><span onclick="addEmoji('🚀')">🚀</span>
                    <!-- الإيماءات والأيادي -->
                    <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('👎')">👎</span><span onclick="addEmoji('👏')">👏</span><span onclick="addEmoji('🙌')">🙌</span><span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('🤝')">🤝</span>
                    <span onclick="addEmoji('✌️')">✌️</span><span onclick="addEmoji('💪')">💪</span><span onclick="addEmoji('👌')">👌</span><span onclick="addEmoji('🫡')">🫡</span><span onclick="addEmoji('👋')">👋</span><span onclick="addEmoji('👇')">👇</span>
                    <!-- القلوب والتفاعلات -->
                    <span onclick="addEmoji('💖')">💖</span><span onclick="addEmoji('💙')">💙</span><span onclick="addEmoji('💚')">💚</span><span onclick="addEmoji('💛')">💛</span><span onclick="addEmoji('💜')">💜</span><span onclick="addEmoji('🖤')">🖤</span>
                    <span onclick="addEmoji('💥')">💥</span><span onclick="addEmoji('⭐')">⭐</span><span onclick="addEmoji('🌟')">🌟</span><span onclick="addEmoji('🎁')">🎁</span><span onclick="addEmoji('☕')">☕</span><span onclick="addEmoji('🍕')">🍕</span>
                </div>
            </div>
            
            <input type="file" id="file-input">
            <button onclick="sendMessage()">إرسال الرسالة</button>
        </div>

        <!-- شريط الأعضاء النشطين -->
        <div class="users-sidebar">
            <h4>متصل الآن (<span id="user-count">0</span>)</h4>
            <div id="users-list"></div>
        </div>
    </div>
    
    <hr style="border-color: var(--border); margin: 20px 0;">
    
    <!-- منطقة المكالمات المحدثة -->
    <h4 style="margin: 0 0 10px 0;">المكالمات والتواصل الصوتي / الفيديو</h4>
    <div class="call-controls">
        <button class="btn-call" onclick="startCall(true)">🎥 بدء مكالمة فيديو</button>
        <button class="btn-call" onclick="startCall(false)">📞 بدء مكالمة صوتية</button>
        <button class="btn-hangup" onclick="endCall()">❌ إنهاء المكالمة</button>
    </div>

    <div class="video-grid">
        <video id="localVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let localStream, peerConnection;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function login() {
        const username = document.getElementById('username').value.trim();
        const dateInput = document.getElementById('special-date').value;
        if (!username || !dateInput) return alert('برجاء ملء جميع البيانات');

        const parts = dateInput.split('-');
        const formattedDate = `${parts[2]}.${parts[1]}.${parts[0]}`;

        socket.emit('join', { username, date: formattedDate });
    }

    socket.on('access-denied', (msg) => {
        document.getElementById('error-msg').innerText = msg;
    });

    socket.on('access-granted', () => {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
    });

    socket.on('update-user-list', (users) => {
        const list = document.getElementById('users-list');
        document.getElementById('user-count').innerText = users.length;
        list.innerHTML = '';
        users.forEach(user => {
            list.innerHTML += `<div class="user-item"><span class="online-dot"></span>${user}</div>`;
        });
    });

    socket.on('system-message', (msg) => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div style="color:var(--text-muted); font-size:12px; text-align:center; margin: 6px 0;">${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    });

    function toggleEmojiPicker() {
        document.getElementById('emoji-picker').classList.toggle('hidden');
    }

    function addEmoji(emoji) {
        const input = document.getElementById('message-input');
        input.value += emoji;
        document.getElementById('emoji-picker').classList.add('hidden');
        input.focus();
    }

    function sendMessage() {
        const text = document.getElementById('message-input').value;
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];

        if (!text && !file) return;

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('chat-message', { text, file: e.target.result, fileName: file.name, fileType: file.type });
            };
            reader.readAsDataURL(file);
        } else {
            socket.emit('chat-message', { text });
        }

        document.getElementById('message-input').value = '';
        fileInput.value = '';
    }

    socket.on('new-message', (data) => {
        const box = document.getElementById('chat-box');
        let content = `<div class="msg"><span>${data.username}:</span> ${data.text || ''}`;
        
        if (data.file) {
            if (data.fileType.startsWith('image/')) {
                content += `<br><img src="${data.file}" style="max-width:200px; border-radius:8px; margin-top:5px;">`;
            } else {
                content += `<br><a href="${data.file}" download="${data.fileName}" style="color:#38bdf8;">تحميل الملف (${data.fileName})</a>`;
            }
        }
        content += `</div>`;
        box.innerHTML += content;
        box.scrollTop = box.scrollHeight;
    });

    // التحكم بالصوت والفيديو وإغلاق المكالمة
    async function startCall(isVideo) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = e => { if (e.candidate) socket.emit('ice-candidate', e.candidate); };
            peerConnection.ontrack = e => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('call-user', { offer, isVideo });
        } catch (err) {
            alert('تعذر الوصول إلى الكاميرا/المايكروفون.');
        }
    }

    function endCall() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        document.getElementById('localVideo').srcObject = null;
        document.getElementById('remoteVideo').srcObject = null;
        socket.emit('end-call');
    }

    socket.on('incoming-call', async ({ offer, isVideo }) => {
        const typeStr = isVideo ? 'فيديو' : 'صوتية';
        if (confirm(`هناك مكالمة ${typeStr} واردة، هل تريد الرد؟`)) {
            localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = e => { if (e.candidate) socket.emit('ice-candidate', e.candidate); };
            peerConnection.ontrack = e => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer-call', answer);
        }
    });

    socket.on('call-answered', async (answer) => {
        if (peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        }
    });

    socket.on('ice-candidate', async (candidate) => {
        if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    });

    socket.on('call-ended', () => {
        alert('تم إنهاء المكالمة من الطرف الآخر.');
        endCall();
    });
    <button onclick="clearChat()">🗑️ مسح جميع الرسائل</button>
</script>
</body>
</html>
